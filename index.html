<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pharm From Home — ฝึกปฏิบัติร้านยา</title>
  <link rel="icon" type="image/jpeg" href="img/logo.jpg?v=2" />
  <link rel="stylesheet" href="css/main.css?v=6aa43acd" />

  <!-- Firebase SDK (compat v9) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
</head>
<body>

<div id="app"></div>

<!-- Core modules (load order matters) — v3.0 -->
<script src="js/utils.js?v=98edd737"></script>
<script src="js/firebase-config.js?v=3e6e6082"></script>
<script src="js/gemini.js?v=9f6ffe04"></script>
<script src="js/gemini-live.js?v=7f8fb084"></script>
<script src="js/gemini-tts.js?v=6ef7741a"></script>
<script src="js/auth.js?v=200144bb"></script>
<script src="js/db.js?v=2825e68b"></script>
<script src="js/prompts.js?v=3c0a3bdb"></script>
<script src="js/drug-data.js?v=8bd7dcbd"></script>
<script src="js/voice-ladder.js?v=0"></script>

<!-- Screens -->
<script src="js/screens/login.js?v=c4586291"></script>
<script src="js/screens/dashboard.js?v=b5635dc4"></script>
<script src="js/screens/groups.js?v=ee5512e5"></script>
<script src="js/screens/cases.js?v=86f025c0"></script>
<script src="js/screens/drugs-modal.js?v=af7d5efa"></script>
<script src="js/screens/chat.js?v=58129621"></script>
<script src="js/screens/summary.js?v=21d16fe3"></script>
<script src="js/screens/history.js?v=7976f1a6"></script>
<script src="js/screens/admin.js?v=14009cfa"></script>

<!-- Router (init last) -->
<script src="js/router.js?v=93119f3b"></script>
<script>
  initTheme(); // apply saved theme before first render
  // Wait for Firebase Auth to restore session before first route dispatch
  onAuthReady((user) => {
    const hash = window.location.hash.replace('#', '');
    if (!user && hash !== 'login' && hash !== '') {
      window.location.hash = '#login';
    } else if (user && (!hash || hash === 'login')) {
      window.location.hash = '#dashboard';
    }
    Router.init();
  });
</script>

</body>
</html>
